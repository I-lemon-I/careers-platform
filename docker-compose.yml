version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: careers-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: careers_db
      JWT_SECRET: o249-schg4923-cm2o-hv043-nb4389-e5dc-3q0923d32
      JWT_EXPIRES_IN: 7d
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - careers_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careers-backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: careers_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      API_TOKEN: careers-platform-secret-token-2024
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - careers_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: careers-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@careers.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - careers_network

volumes:
  postgres_data:

networks:
  careers_network:
    driver: bridge